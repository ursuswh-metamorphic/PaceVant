[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache-foundry"
libs = ["node_modules"]
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./fixtures" }]

[fuzz]
runs = 256
