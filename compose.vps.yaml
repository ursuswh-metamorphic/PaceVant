# Public HTTPS entrypoint. Supply only a hostname in deploy/hosting.env.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      PACEVANT_HOSTNAME: ${PACEVANT_HOSTNAME:?Set PACEVANT_HOSTNAME in deploy/hosting.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy-data:
  caddy-config:
