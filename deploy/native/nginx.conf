# Initial IP/domain smoke. Enable TLS with Certbot before transmitting any operator secret.
limit_req_zone $binary_remote_addr zone=pacevant_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pacevant_start:10m rate=6r/m;
server {
    listen 80;
    server_name _ localhost 127.0.0.1;
    root /opt/pacevant/current/frontend/dist;
    index index.html;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location / { try_files $uri $uri/ /index.html; }
    location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
    location = /judge/jobs {
        limit_req zone=pacevant_start burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/pacevant-proxy.conf;
    }
    location /judge/ {
        limit_req zone=pacevant_read burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/pacevant-proxy.conf;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/pacevant-proxy.conf; }
    location = /readyz { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/pacevant-proxy.conf; }
    location ~ ^/(mvp|execution|v1|v2|v3|docs|redoc|openapi.json|debug|rpc)(/|$) { return 404; }
    location ~ /\. { return 404; }
    access_log /var/log/nginx/pacevant-access.log;
    error_log /var/log/nginx/pacevant-error.log warn;
}
