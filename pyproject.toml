[project]
name = "pacevant-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eth-abi>=5.2,<7",
    "eth-keys>=0.7,<1",
    "eth-hash[pycryptodome]>=0.7,<1",
    "eth-utils>=5.3,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "rfc8785==0.1.4",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["apps/control-plane", "packages/contracts-api"]
testpaths = ["apps/control-plane/tests", "tests/integration"]

[tool.ruff]
line-length = 100
src = ["apps/control-plane", "packages/contracts-api", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
