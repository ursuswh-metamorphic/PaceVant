[project]
name = "pacevant-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "treasury-contracts-api==1.3.1",
    "eth-abi>=5.2,<7",
    "eth-keys>=0.7,<1",
    "eth-hash[pycryptodome]>=0.7,<1",
    "eth-utils>=5.3,<7",
    "fastapi==0.121.3",
    "pydantic-settings==2.12.0",
    "httpx>=0.28,<0.29",
    "rfc8785==0.1.4",
    "uvicorn==0.38.0",
    "python-dotenv==1.2.4",
    "filelock==3.20.0",
]

[project.scripts]
treasury = "treasury_backend.operations.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/treasury_backend"]

[tool.uv.sources]
treasury-contracts-api = { path = "packages/contracts-api", editable = true }

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend/src", "packages/contracts-api"]
testpaths = ["backend/tests", "backend/src/treasury_backend/modules"]
markers = ["integration: requires native Anvil and compiled contracts"]

[tool.ruff]
line-length = 100
src = ["backend/src", "packages/contracts-api", "backend/tests"]
extend-exclude = ["backend/src/treasury_backend/modules/execution", "backend/src/treasury_backend/api/execution.py", "backend/src/treasury_backend/config/execution.py", "backend/tests/execution", "packages/contracts-api/treasury_contracts", "tools/quality/scan_secrets.py", "backend/tests/integration/a_consumer_probe.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
