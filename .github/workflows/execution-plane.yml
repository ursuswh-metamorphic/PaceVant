name: Execution Plane B
on:
  push:
  pull_request:
jobs:
  contracts-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - run: npm ci --ignore-scripts
      - run: npm run setup
      - run: npm run check
