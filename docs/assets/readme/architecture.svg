<rect x="60" y="716" width="1480" height="88" rx="16" fill="#E4F0EA" stroke="#C3DFD2"/>
<text x="84" y="749" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#246F60">Runtime public hiện tại: Build → Simulation → Risk → ITAG → Z3 → SDE → Sign → Preflight → Relay</text>
<text x="84" y="780" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#54796D">MEV reserve-shift stress là thí nghiệm LOCAL/research, không phải một engine độc lập mặc định trong public workflow.</text>
