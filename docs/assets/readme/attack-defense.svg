 <text x="461" y="315" font-size="15" fill="#9DB2C3">LOCAL receipts đã đối soát</text>

 <rect x="817" y="145" width="334" height="219" rx="18" fill="#172D3A" stroke="#B48B57" stroke-width="1.6"/>
 <rect x="841" y="166" width="119" height="28" rx="14" fill="#4A3A2C"/><text x="901" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#F1CA87">PROPOSED</text>
 <text x="841" y="246" font-size="48" font-weight="800" fill="#FCFFFF">+ 10 USDC</text>
