 <rect x="1197" y="145" width="346" height="219" rx="18" fill="#252B39" stroke="#CE727A" stroke-width="2"/>
 <rect x="1221" y="166" width="112" height="28" rx="14" fill="#58323B"/><text x="1277" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#FFADB4">ITAG VETO</text>
 <path d="M1238 224l18 18m0-18l-18 18" stroke="#FF9EA7" stroke-linecap="round" stroke-width="6"/>
