<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" role="img" aria-label="Minh họa bài kiểm thử ITAG trên Anvil: ngân sách 20 USDC, hai giao dịch 10 USDC, giao dịch thứ ba bị chặn trước signing">
<defs><linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1726"/><stop offset="1" stop-color="#142432"/></linearGradient></defs>
