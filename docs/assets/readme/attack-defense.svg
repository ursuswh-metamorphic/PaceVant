 <rect x="437" y="145" width="334" height="219" rx="18" fill="#172D3A" stroke="#34505D" stroke-width="1.6"/>
 <rect x="461" y="166" width="118" height="28" rx="14" fill="#234841"/><text x="520" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#86EEC5">CONFIRMED</text>
 <text x="461" y="246" font-size="46" font-weight="800" fill="#FCFFFF">10 + 10</text>
