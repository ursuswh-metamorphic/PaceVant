<text x="58" y="436" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#C7DBE4">Bằng chứng: LOCAL Anvil budget-isolation test (actual receipts + matched counterfactual decisions).</text>
<text x="58" y="461" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#8BA4B2">Sơ đồ diễn giải kết quả kiểm thử đã ghi nhận; không phải ảnh một cuộc tấn công live trên Fuji.</text>
